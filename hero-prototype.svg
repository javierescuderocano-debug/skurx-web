<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 650" role="img" aria-labelledby="title desc">
<title id="title">Capacidad liberada</title><desc id="desc">Composición arquitectónica oscura abierta hacia un paisaje luminoso, inspirada en la dirección visual aprobada.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9eef0"/><stop offset=".48" stop-color="#c9d6dc"/><stop offset="1" stop-color="#91a9b5"/></linearGradient>
  <linearGradient id="light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#aebdc2"/><stop offset=".52" stop-color="#f3eee1"/><stop offset="1" stop-color="#d7d4c9"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#11191c"/><stop offset=".55" stop-color="#263136"/><stop offset="1" stop-color="#0b1113"/></linearGradient>
  <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#263136"/><stop offset="1" stop-color="#0b1012"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#29353a"/><stop offset="1" stop-color="#0c1214"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
